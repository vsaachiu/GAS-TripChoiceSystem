  function processStudentData(students, tripCounts, dataFields) {
    // Process each student
    students.forEach(student => processStudent(student, tripCounts, dataFields));

    return students;
  }

  function processStudent(student, tripCounts, dataFields){
      // Initialize currentChoice and Selected
      student.currentChoice = {};
      student.selected = [];
      student.countSelected = 0;

      // Loop through each tripCount record and add to currentChoice.
      tripCounts.forEach(trip => {
        const choiceID = trip.choiceID;
        // Check if the student has the choiceID
        if (student[choiceID] !== undefined) {
          // Add the trip details to currentChoice
          if(student[choiceID] === 1) {
            student.currentChoice[choiceID] = true;
          } else if(student[choiceID] === -1) {
            student.currentChoice[choiceID] = -1;
          } else {
            student.currentChoice[choiceID] = false;
          }

          // Add to Selected if the value is true
          if (student[choiceID] === 1 || student[choiceID] === true) {
            student.selected.push(choiceID);
            student.countSelected++;
          }
        }
        
      });

      student.currentExtraData = {};
      for (var f = 0; f < dataFields.length; f++){
        var dataId = dataFields[f];
         if (student[dataId] !== undefined) {
          student.currentExtraData[dataId] = student[dataId];
         }
      }
      student.lastSavedChoice = JSON.parse(JSON.stringify(student.currentChoice)); //clone currentChoice as the last saved choice
      student.lastSavedExtraData = JSON.parse(JSON.stringify(student.currentExtraData)); //clone extraData as last saved extra data
    }
    
    $scope.checkOverseasTrip = function(s) {
      if (s.currentExtraData.T25HK === 0) {
        // Hide the overseas trips container
        angular.forEach(s.currentChoice, function(value, key) {
          s.currentChoice[key] = false;
        });
      }
    };

    function fetchCountsData() {
      $scope.dataFetching = true;
      google.script.run.withSuccessHandler(tripCountsReceived).getTripCounts();
    }
    
    $scope.postChoices = function(data, sindex){
      $scope.dataFetching = true;
      google.script.run.withSuccessHandler(saveSuccess).approverPostData(data, sindex);
    };
    
    $scope.studentPostChoices = function(rowindex, studentId, currentChoice, currentExtraData, sindex){
      //console.log(data);
      $scope.dataFetching = true;
      google.script.run.withSuccessHandler(saveSuccess).studentPostData(rowindex, studentId, currentChoice, currentExtraData, sindex);
    };
    
    function saveSuccess(e){
      $scope.dataFetching = false;
      //console.log(e);
      //console.log(e.hasOwnProperty("choice"));
      $scope.error = e.error;
      if(e.hasOwnProperty("update")){ //if no error, update data
        var update = e.update;
        var s = $scope.students[e.sindex];
        for (const key in update){
          s[key] = update[key]
        }
        processStudent(s, $scope.tripCounts, $scope.data.dataFields);
        //$scope.tripChoiceForm.$setPristine();
      }else{ //if no choice data, let's assume error and refresh data for user.
        loadData();
      }
      //console.log($scope);
      $scope.$digest();
    };
    
    

    // Array of trip names to track
    //const tripNames = Object.keys($scope.s.choice).filter(key => $scope.tripCounts.some(trip => trip.name === key));
    
    // Function to count checked boxes
    $scope.updateSelected = function(student) {
      // Clear the existing Selected list
      student.selected = [];
      student.countSelected = 0;
      // Iterate through currentChoice keys
      for (const key in student.currentChoice) {
        if (student.currentChoice[key] === 1 || student.currentChoice[key] === true) {
          student.selected.push(key); // Add key name if selected is true
          student.countSelected++;
        }
      }
      //console.log(student.selected);
      //console.log(student.countSelected);
      //console.log(student);
    };

    $scope.noChangesSinceSave = function(a,b) {
        return angular.equals(a, b);
    };
    
    //clear all overseas trips of if HK selected
    $scope.checkOverseasTrip = function(s) {
      if (s.currentExtraData.T25HK === 1) {
        // Hide the overseas trips container
        angular.forEach(s.currentChoice, function(value, key) {
          s.currentChoice[key] = false;
        });
      }
      $scope.updateSelected(s);
      //console.log(s);
    };


      
})

//-----
// getExistingRow - returns the row that contains the data matching the criteria, or returns the next row in the spreadsheet.
//
//-----
function getExistingRow(myList,checkCol,checkCriteria){
  var myRow = 0;
  while (myRow < myList.length){
    if (myList[myRow][checkCol] == checkCriteria) {
      return myRow;
    }
    myRow++;
  } 
  return myRow;
}



//-----
//   getRowsMatching takes a data list and searches the sortIndex for all values that match valueToFind, returning the rows that match this value
//-----

function getRowsMatching(myDataList, sortIndex, valueToFind){
  
  var foundList = new Array();
  
  myDataList.sort(function(a, b){ //Sort the items by studentID
    var x = a[sortIndex];
    var y = b[sortIndex];
    return (x < y ? -1 : (x > y ? 1 : 0));});
  
  var cdr = 0;
  var found = false; 
  
  while ( cdr < myDataList.length){
    if (myDataList[cdr][sortIndex] == valueToFind) {
      found=true;
      foundList.push(myDataList[cdr])
    }
    else if (found){
      return foundList;
    }
    cdr++;
  }

  return foundList;
  
}

//Returns True if Value is found in col column of myArray 2D array
function findThisInArray(myArray, value, col){
  for( var i = 0; i < myArray.length; i++ ) {
      if(myArray[i][col] == value ) {
          return true;
          break;
      }
    
  }
  return false;
}
